server {
  listen 80;
  listen [::]:80;
  server_name hmqa.duckdns.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hmqa.duckdns.org;

  ssl_certificate /etc/letsencrypt/live/hmqa.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hmqa.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:HMQA_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 20m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options DENY always;

  location = /admin {
    return 308 /;
  }

  location = /api {
    return 308 /documentation;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_pass http://127.0.0.1:8080;
  }
}
