worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format structured escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time,"remote":"$remote_addr"}';
  access_log /var/log/nginx/access.log structured;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/s;
  map $http_x_forwarded_proto $hmqa_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  map $http_x_request_id $hmqa_request_id {
    default $http_x_request_id;
    "" $request_id;
  }
  upstream api { server api:3001; keepalive 32; }
  upstream bot { server bot:3002; keepalive 16; }
  upstream admin { server admin-web:3000; keepalive 32; }
  server {
    listen 8080;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    location /api/v1/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $hmqa_request_id;
      proxy_set_header X-Forwarded-Proto $hmqa_forwarded_proto;
      proxy_pass http://api;
    }
    location = /telegram/webhook {
      limit_req zone=webhook_limit burst=100 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $hmqa_request_id;
      proxy_set_header X-Forwarded-Proto $hmqa_forwarded_proto;
      proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
      proxy_pass http://bot;
    }
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $hmqa_request_id;
      proxy_set_header X-Forwarded-Proto $hmqa_forwarded_proto;
      proxy_pass http://admin;
    }
  }
}
